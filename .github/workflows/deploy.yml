name: Deploy Production

# Deploiement automatique sur Render apres un CI vert sur main.
# Le lien GitHub -> Render (auto-deploy) n'etant pas actif, on declenche le "Deploy Hook" de Render.
# Prerequis : secret GitHub RENDER_DEPLOY_HOOK (Render > service > Settings > Deploy Hook).
# Les migrations SQL (supabase/migrations) restent appliquees AVANT le merge d'un code qui en depend.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: write   # uniquement pour deplacer le tag "deployed" apres un deploiement reussi

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://pms-riviera.onrender.com
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Determiner si l'application a change
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"; echo "Declenchement manuel : deploiement force"; exit 0
          fi
          # Base de comparaison : dernier commit effectivement deploye (tag "deployed"), pour ne perdre aucun
          # changement quand plusieurs merges sont pousses d'un coup ; repli sur le commit precedent.
          if git rev-parse -q --verify refs/tags/deployed >/dev/null && git merge-base --is-ancestor deployed HEAD; then
            BASE=deployed
          else
            BASE=HEAD~1
          fi
          echo "Base de comparaison : $BASE ($(git rev-parse --short $BASE))"
          CHANGED=$(git diff --name-only $BASE HEAD || true)
          echo "Fichiers modifies :"; echo "$CHANGED"
          # Rien a deployer si seuls tests, documentation, workflows ou migrations SQL ont change
          if [ -z "$CHANGED" ] || ! echo "$CHANGED" | grep -qvE '^(tests/|\.github/|supabase/|.*\.md$)'; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"; echo "Aucun changement applicatif : deploiement ignore"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verifier le secret Render
        if: steps.changes.outputs.deploy == 'true'
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::error::Secret RENDER_DEPLOY_HOOK manquant (Settings > Secrets and variables > Actions)"; exit 1
          fi

      - name: Declencher le deploiement Render
        if: steps.changes.outputs.deploy == 'true'
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          code=$(curl -s -o /tmp/render-out.txt -w '%{http_code}' -X POST "$RENDER_DEPLOY_HOOK")
          echo "Render a repondu HTTP $code"
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then echo "::error::Echec du declenchement du deploiement"; exit 1; fi

      - name: Attendre que le service reponde
        if: steps.changes.outputs.deploy == 'true'
        run: |
          sleep 60
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE_URL/api/health" || echo 000)
            echo "essai $i : health HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          echo "::error::Le service n'est pas revenu en ligne apres le deploiement"; exit 1

      - name: Marquer ce commit comme deploye
        if: steps.changes.outputs.deploy == 'true' && github.event_name != 'workflow_dispatch'
        run: |
          git tag -f deployed HEAD
          git push -f origin refs/tags/deployed
